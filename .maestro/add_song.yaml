# E2E: 곡 추가 플로우 (직접 추가)
# 깨끗한 상태로 시작 -> 곡 검색 시트 -> 검색어 입력 -> "직접 추가" -> 아티스트 입력 -> 곡 상세 진입 확인
# 실행: maestro test .maestro/add_song.yaml
appId: com.playlist.app
---
- launchApp:
    clearState: true

# 빈 상태 안내 확인
- assertVisible: "아직 녹음한 곡이 없어요"

# 헤더의 + 버튼 탭
- tapOn:
    id: "add-song-button"

# 검색어 입력 후 직접 추가로 전환(검색어가 제목으로 채워진다)
- tapOn:
    id: "song-search-input"
- inputText: "테스트곡 E2E"
- tapOn:
    id: "manual-add-button"
- tapOn:
    id: "manual-artist-input"
- inputText: "테스트가수"
- tapOn:
    id: "manual-submit-button"

# 곡 상세 화면으로 이동했는지 확인 후, 뒤로 가서 목록에 보이는지 확인
- assertVisible: "테스트곡 E2E"
- tapOn:
    id: "header-back"
- assertVisible: "테스트곡 E2E"
- assertVisible: "테스트가수.*"
